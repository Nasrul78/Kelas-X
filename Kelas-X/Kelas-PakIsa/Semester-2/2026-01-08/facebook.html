<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facebook - log in or sign up</title>
  </head>
  <body style="height: 100vh; background-color: aliceblue">
    <main
      style="
        display: flex;
        justify-content: center;
        padding: 2%;
        gap: 2%;
        height: 90%;
      "
    >
      <!-- Box Kiri -->
      <section style="width: 50%; flex: 1; margin: auto auto">
        <img src="img/facebook.svg" alt="" width="320px" />
        <p style="font-size: 28px; margin: 0 0 0 0">
          Facebook helps you connect and share with the people in your life.
        </p>
      </section>

      <!-- Box Kanan -->
      <section
        style="
          width: 50%;
          display: flex;
          gap: 16px;
          flex-direction: column;
          justify-content: center;
          align-items: center;
        "
      >
        <div
          style="
            background-color: white;
            padding: 16px;
            border-radius: 0.625rem;
            text-align: center;
            display: flex;
            gap: 12px;
            place-items: center;
            flex-direction: column;
            box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.1);
          "
        >
          <form
            action=""
            style="display: flex; flex-direction: column; gap: 16px"
          >
            <input type="text" style="width: 364px; height: 52px" />
            <input type="text" style="width: 364px; height: 52px" />

            <button type="submit" style="width: 364px; height: 48px">
              Log in
            </button>
            <a href="">Forgotten password?</a>
          </form>

          <hr style="width: 364px" />

          <button style="width: 200px; height: 48px">Create new account</button>
        </div>

        <p>
          <a style="font-weight: bold;">Create a Page</a style="font-weight: bold;"> for a celebrity, brand or business.
        </p>
      </section>
    </main>

    <footer>
      <p>Ini facebook palsu</p>
      <p>Dibuat oleh Nasrul&copy;</p>
    </footer>
  </body>
</html>
