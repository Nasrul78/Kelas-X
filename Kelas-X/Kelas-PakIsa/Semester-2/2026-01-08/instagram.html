  <body style="height: 100vh">
    <!-- Box Kiri -->
    <main
      style="
        display: flex;
        justify-content: center;
        padding: 2%;
        gap: 2%;
        height: 90%;
      "
    >
      <section
        style="width: 40%; flex: 1; margin: auto auto; text-align: center"

      <!-- Box Kanan -->
      <section

          gap: 16px;
          flex-direction: column;
          align-items: center;
        "
      >
        <h3 style="text-align: center">Instagram</h3>

        <form
          action=""
          style="
            width: 270px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
          "
        >
          <input
            type="text"
            placeholder="Nomer ponsel, nama pengguna atau email"
            style="width: 270px; height: 38px"
          />
          <input
            type="text"
            placeholder="Kata Sandi"
            style="width: 270px; height: 38px"
          />

          <button
            type="submit"
            style="width: 270px; margin-top: 4px; height: 32px"
          >
            Masuk
          </button>
        </form>

        <hr style="width: 270px; margin: 6px 0" />

        <section
          style="
            display: flex;
            flex-direction: column;
            text-align: center;
            margin-bottom: 32px;
          "
        >
          <a>Login dengan Facebook</a>
          <a href="#">Lupa kata sandi?</a>
        </section>

        <a href="#">Buat akun baru</a>
      </section>
