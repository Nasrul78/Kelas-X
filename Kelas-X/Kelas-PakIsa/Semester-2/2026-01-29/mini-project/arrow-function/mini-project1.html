<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Project 1</title>
  </head>
  <body>
    <h3>Kuadrat</h3>

    <input id="n" />
    <button onclick="kuadrat()">Kuadrat</button>

    <p id="hasil"></p>

    <script>
      let n = document.getElementById("n")
      let hasil = document.getElementById("hasil")

      const kuadrat = () => (hasil.innerHTML = n.value * n.value)
    </script>
  </body>
</html>
