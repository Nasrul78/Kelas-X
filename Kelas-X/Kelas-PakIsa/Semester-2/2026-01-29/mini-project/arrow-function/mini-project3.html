<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Project 3</title>
  </head>
  <body>
    <h3>Hitung Jumlah</h3>

    <input id="a" />
    <input id="b" />
    <button onclick="jumlah()">Jumlah</button>

    <p id="hasil"></p>

    <script>
      let a = document.getElementById("a")
      let b = document.getElementById("b")
      let hasil = document.getElementById("hasil")

      const jumlah = () => (hasil.innerHTML = Number(a.value) + Number(b.value))
    </script>
  </body>
</html>
