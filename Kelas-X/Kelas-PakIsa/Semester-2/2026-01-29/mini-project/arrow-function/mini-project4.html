<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Project 4</title>
  </head>
  <body>
    <h3>Cek Usia</h3>

    <input id="usia" />
    <button onclick="cek()">Cek Usia</button>

    <p id="hasil"></p>

    <script>
      let usia = document.getElementById("usia")
      let hasil = document.getElementById("hasil")

      const cek = () =>
        (hasil.innerHTML = usia.value >= 17 ? "Dewasa" : "Anak-anak")
    </script>
  </body>
</html>
