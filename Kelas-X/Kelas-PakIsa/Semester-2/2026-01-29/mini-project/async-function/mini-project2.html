<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Project 2</title>
  </head>
  <body>
    <h3>Tampilkan Data</h3>

    <button onclick="load()">Load</button>

    <p id="hasil"></p>

    <script>
      async function load() {
        hasil.innerHTML = "Loading. . . . "
        await new Promise((r) => setTimeout(r, 2000))
        hasil.innerHTML = "Data Tampil"
      }
    </script>
  </body>
</html>
