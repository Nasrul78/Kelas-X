<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Project 4</title>
  </head>
  <body>
    <h3>Hitung Umur</h3>

    <input id="tahun" />
    <button onclick="umur()">Hitung Umur</button>

    <p id="hasil"></p>

    <script>
      function umur() {
        let tahun = Number(document.getElementById("tahun").value)
        let hasil = document.getElementById("hasil")

        hasil.innerHTML = 2026 - tahun + " Tahun"
      }
    </script>
  </body>
</html>
