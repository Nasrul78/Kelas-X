<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Project 5</title>
  </head>
  <body>
    <h3>Hitung Diskon</h3>

    <input id="harga" />
    <button onclick="diskon()">Diskon</button>

    <p id="hasil"></p>

    <script>
      function diskon() {
        let harga = Number(document.getElementById("harga").value)
        let hasil = document.getElementById("hasil")

        hasil.innerHTML = harga * 0.1
      }
    </script>
  </body>
</html>
