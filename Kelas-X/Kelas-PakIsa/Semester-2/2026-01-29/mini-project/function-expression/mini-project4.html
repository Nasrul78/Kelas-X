<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Project 4</title>
  </head>
  <body>
    <h3>Sapa Nama</h3>

    <input id="nama" />
    <button onclick="sapa()">Sapa</button>

    <p id="hasil"></p>

    <script>
      let nama = document.getElementById("nama")
      let hasil = document.getElementById("hasil")

      const sapa = function () {
        hasil.innerHTTML = "Halo" + nama.value
      }
    </script>
  </body>
</html>
